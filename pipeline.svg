<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="345" viewBox="0 0 1050 345" role="img"><title>Game observations flow through the neural player to legal actions; human imitation and PPO train the model, with a separate critic</title><rect width="100%" height="100%" fill="#0d1016"/><style>text{font-family:Segoe UI,Arial,sans-serif}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#5ad1a0"/></marker></defs><rect x="28" y="28" width="300" height="170" fill="none" stroke="#283142"/><text x="46" y="65" font-size="28" fill="#5ad1a0" font-weight="600">Observe</text><text x="46" y="104" font-size="20" fill="#e7ecf5" font-weight="400">Board + troop state</text><text x="46" y="136" font-size="20" fill="#e7ecf5" font-weight="400">Own hand + resources</text><text x="46" y="168" font-size="20" fill="#e7ecf5" font-weight="400">Public opponent history</text><rect x="375" y="28" width="300" height="170" fill="none" stroke="#283142"/><text x="393" y="65" font-size="28" fill="#5ad1a0" font-weight="600">Neural player</text><text x="393" y="104" font-size="20" fill="#e7ecf5" font-weight="400">Spatial U-Net + transformers</text><text x="393" y="136" font-size="20" fill="#e7ecf5" font-weight="400">Fuse board and event history</text><text x="393" y="168" font-size="20" fill="#e7ecf5" font-weight="400">5.15M policy parameters</text><rect x="722" y="28" width="300" height="170" fill="none" stroke="#283142"/><text x="740" y="65" font-size="28" fill="#5ad1a0" font-weight="600">Act</text><text x="740" y="104" font-size="20" fill="#e7ecf5" font-weight="400">Wait / play / ability</text><text x="740" y="136" font-size="20" fill="#e7ecf5" font-weight="400">Card + placement</text><text x="740" y="168" font-size="20" fill="#e7ecf5" font-weight="400">Rust or real-game command</text><path d="M333 112H367" stroke="#5ad1a0" stroke-width="2" marker-end="url(#arrow)"/><path d="M680 112H714" stroke="#5ad1a0" stroke-width="2" marker-end="url(#arrow)"/><text x="28" y="244" font-size="23" fill="#e7ecf5" font-weight="400">Learn: human replay imitation → PPO self-play → independent evaluation</text><text x="28" y="282" font-size="20" fill="#9ca8bd" font-weight="400">A separate critic is used during training; it is outside the deployed actor’s input path.</text><text x="28" y="323" font-size="18" fill="#9ca8bd" font-weight="400">Frozen L10 EMA @100 · 6,672,466 total parameters · 5,152,965 policy parameters</text></svg>