<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="390" viewBox="0 0 1050 390" role="img"><title>Neural architecture: board U-Net and troop/event transformer, feature fusion, staged action heads; separate training critic</title><rect width="100%" height="100%" fill="#ffffff"/><style>text{font-family:Arial,sans-serif}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#222222"/></marker></defs><rect x="20" y="20" width="340" height="107" fill="none" stroke="#222222"/><text x="34" y="51" font-size="24" fill="#222222" font-weight="600">Board → spatial U-Net</text><text x="34" y="80" font-size="20" fill="#222222" font-weight="400">32 × 18 tiles</text><text x="34" y="107" font-size="20" fill="#222222" font-weight="400">Widths: 96 / 144 / 192</text><rect x="20" y="147" width="340" height="134" fill="none" stroke="#222222"/><text x="34" y="178" font-size="24" fill="#222222" font-weight="600">Entity / event transformer</text><text x="34" y="207" font-size="20" fill="#222222" font-weight="400">64 entity tokens · 32 event tokens</text><text x="34" y="234" font-size="20" fill="#222222" font-weight="400">3 layers · 4 heads · width 128</text><text x="34" y="261" font-size="20" fill="#222222" font-weight="400">Own resources + public history</text><rect x="410" y="87" width="220" height="107" fill="none" stroke="#222222"/><text x="424" y="118" font-size="24" fill="#222222" font-weight="600">Feature fusion</text><text x="424" y="147" font-size="20" fill="#222222" font-weight="400">2 layers · 4 heads</text><text x="424" y="174" font-size="20" fill="#222222" font-weight="400">Board + context</text><rect x="680" y="35" width="350" height="219" fill="none" stroke="#222222"/><text x="694" y="66" font-size="24" fill="#222222" font-weight="600">Staged action heads</text><text x="694" y="95" font-size="20" fill="#222222" font-weight="400">Wait / play / ability</text><text x="694" y="122" font-size="20" fill="#222222" font-weight="400">Wait duration</text><text x="694" y="149" font-size="20" fill="#222222" font-weight="400">Card: 4 hand slots</text><text x="694" y="176" font-size="20" fill="#222222" font-weight="400">Placement: 576 tiles, per card</text><text x="694" y="203" font-size="20" fill="#222222" font-weight="400">Ability carrier</text><path d="M360 73H383V115H410" fill="none" stroke="#222222" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M360 214H383V163H410" fill="none" stroke="#222222" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M630 140H680" fill="none" stroke="#222222" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="410" y="222" width="220" height="59" fill="none" stroke="#555555" stroke-dasharray="5 4"/><text x="422" y="245" font-size="18" fill="#222222" font-weight="400">Separate training critic</text><text x="422" y="269" font-size="16" fill="#555555" font-weight="400">Not used to choose actions</text><text x="20" y="327" font-size="21" fill="#222222" font-weight="400">Learning: human replay imitation + PPO self-play with frozen opponents and exploiters</text><text x="20" y="365" font-size="20" fill="#555555" font-weight="400">L10 EMA @100 · 6,672,466 total parameters · 5,152,965 in the policy path</text></svg>