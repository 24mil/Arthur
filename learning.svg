<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" role="img" aria-labelledby="title"><title id="title">Human examples + autonomous improvement</title><rect width="1280" height="680" fill="#0a101a"/><style>text{font-family:Segoe UI,Arial,sans-serif}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#7de2b3"/></marker></defs><text x="44" y="60" fill="#edf3fa" font-size="36" font-weight="600">Human examples + autonomous improvement</text><path d="M325,230 L373,230" fill="none" stroke="#7de2b3" stroke-width="2" marker-end="url(#arrow)"/><path d="M655,230 L703,230" fill="none" stroke="#7de2b3" stroke-width="2" marker-end="url(#arrow)"/><path d="M845,316 L845,400" fill="none" stroke="#7de2b3" stroke-width="2" marker-end="url(#arrow)"/><path d="M375,487 L186,487" fill="none" stroke="#7de2b3" stroke-width="2" marker-end="url(#arrow)"/><path d="M186,487 L186,317" fill="none" stroke="#7de2b3" stroke-width="2" marker-end="url(#arrow)"/><rect x="45" y="150" width="280" height="165" rx="14" fill="#121d2c" stroke="#52b5ff"/><text x="63" y="185" fill="#52b5ff" font-size="23" font-weight="600">Recorded human games</text><text x="63" y="222" fill="#9cb0c7" font-size="18">Card, placement, issue time</text><text x="63" y="251" fill="#9cb0c7" font-size="18">Both seats; supported prefixes</text><text x="63" y="280" fill="#9cb0c7" font-size="18">Recorded outcome kept distinct</text><rect x="375" y="150" width="280" height="165" rx="14" fill="#121d2c" stroke="#7de2b3"/><text x="393" y="185" fill="#7de2b3" font-size="23" font-weight="600">Rust reconstruction</text><text x="393" y="222" fill="#9cb0c7" font-size="18">Versioned engine + schema</text><text x="393" y="251" fill="#9cb0c7" font-size="18">Uncertainty and validity masks</text><text x="393" y="280" fill="#9cb0c7" font-size="18">No future information</text><rect x="705" y="150" width="280" height="165" rx="14" fill="#121d2c" stroke="#f5ca79"/><text x="723" y="185" fill="#f5ca79" font-size="23" font-weight="600">Imitation learning</text><text x="723" y="222" fill="#9cb0c7" font-size="18">Supervised action components</text><text x="723" y="251" fill="#9cb0c7" font-size="18">Play-time contract must match</text><text x="723" y="280" fill="#9cb0c7" font-size="18">Held-out checks</text><rect x="375" y="402" width="610" height="170" rx="14" fill="#121d2c" stroke="#7de2b3"/><text x="393" y="437" fill="#7de2b3" font-size="23" font-weight="600">Self-play and selection</text><text x="393" y="474" fill="#9cb0c7" font-size="18">PPO battles vs frozen snapshots and exploiters</text><text x="393" y="503" fill="#9cb0c7" font-size="18">Checkpoint / EMA exports, paired games and retention checks</text><text x="393" y="532" fill="#9cb0c7" font-size="18">Lower imitation loss alone is not a promotion criterion</text><text x="44" y="647" fill="#9cb0c7" font-size="17">Schematic of implemented research workflows, not a claim that every training arm uses every component.</text></svg>